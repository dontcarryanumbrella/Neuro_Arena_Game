<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sword Immortal — slow motion</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#10151e;color:#e3e9ed;font:15px system-ui,sans-serif}
  main{max-width:1280px;margin:auto;padding:26px}h1{margin:0 0 6px;font-size:28px}p{color:#adb9c8;line-height:1.5}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;margin-top:20px}
  canvas{display:block;width:100%;aspect-ratio:16/9;background:#000;image-rendering:pixelated;border:1px solid #40505d}
  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}
  button,select{font:inherit;color:inherit;background:#202d3c;border:1px solid #46576c;border-radius:5px;padding:9px 12px;cursor:pointer}
  button:hover,button[aria-current="true"]{background:#304c61;border-color:#a0deef}button:disabled{opacity:.4;cursor:default}
  label{display:inline-flex;align-items:center;gap:7px}input{accent-color:#9fd8ff}aside{display:grid;gap:7px;align-content:start}
  aside button{text-align:left;font-size:13px}aside small{display:block;color:#aec4d4;margin:3px 0 0 27px}
  h2{font-size:20px;margin-bottom:6px}#description{min-height:44px;margin-top:0}#status{font-variant-numeric:tabular-nums;color:#9fd8ff}
  progress{width:100%;height:5px;accent-color:#9fd8ff}#error{color:#ffb5a7;white-space:pre-wrap}
  .note{font-size:13px}#variant-note{color:#d1cba4}
  @media(max-width:850px){.layout{grid-template-columns:1fr}aside{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:16px}}
</style>
<main>
  <h1>Sword Immortal</h1>
  <p>The Thirteen Swords of Heaven’s End · slow-motion ability preview</p>
  <div id="error" role="alert"></div>
  <div class="layout">
    <section>
      <canvas id="view" width="256" height="144" aria-label="Sword Immortal ability animation"></canvas>
      <progress id="progress" value="0" max="1" aria-label="Ability playback progress"></progress>
      <div class="controls">
        <button id="replay">Replay</button><button id="pause">Pause</button><button id="step">Step one frame</button>
        <label>Speed <select id="speed"><option value="0.1">0.1×</option><option value="0.25" selected>0.25×</option><option value="0.5">0.5×</option><option value="1">1×</option></select></label>
      </div>
      <div class="controls">
        <label><input id="tour" type="checkbox" checked>Play all thirteen</label>
        <label><input id="advanced" type="checkbox">Enhanced Sword Intent</label>
        <label><input id="sound" type="checkbox">Sound</label>
      </div>
      <h2 id="title"></h2><p id="description"></p><p id="variant-note"></p>
      <p id="status" role="status">Loading preview…</p>
      <p class="note">Choose a sword to loop it. Pause and step to inspect each animation frame. Swords X–XIII use Perfect Sword Intent, his second form. Sound effects play at their original pitch.</p>
    </section>
    <aside id="abilities" aria-label="Choose an ability"></aside>
  </div>
</main>
<script>window.addEventListener('error',e=>{document.getElementById('error').textContent='Preview error: '+(e.message||'Unable to load '+(e.target.src||'a script'));},true);</script>
<script src="../js/sfx.js"></script>
<script src="../js/agent.js"></script>
<script src="../js/sim.js"></script>
<script src="../js/render.js"></script>
<script src="../js/swordfx.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const roman = ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII'];
const descriptions = [
  'A quick draw and razor crescent at close range.',
  'A flying lunge followed by slashing afterimages.',
  'Blades rise, hang in the sky, then rain onto the target.',
  'A sweeping crescent of moonlight crosses the arena.',
  'A sword with a forked tail of light flies out and returns.',
  'Shadow swords surround the enemy before cutting through together.',
  'A wall of sword energy rises along the cut and crashes down.',
  'The clouds part; a celestial sword descends and cracks the ground.',
  'First-form ultimate: a ring of swords converges, followed by one great thrust.',
  'Space shimmers and splits open around the enemy.',
  'The enemy is marked; the delayed cut severs cause from effect.',
  'The Immortal becomes sword light and dashes through a lattice of cuts.',
  'Second-form ultimate: stillness, one cut across the world, then its forbidden aftermath.'
];
const durations = [3,3.4,4,3.5,4.5,3.5,4,4,6.5,3,4.5,4.5,6.5];
const idleAction = [0,0,-1,-1,-1,-1,-1,-1,-1];
let sim, renderer, previewBoss, selected = 1, elapsed = 0, accumulator = 0, paused = false, last = 0, started = false;
const buttons = SWORD_NAMES.map((name,i) => {
  const button = document.createElement('button');
  button.textContent = roman[i]+' · '+name;
  if(i===8||i===12){const small=document.createElement('small');small.textContent=i===8?'First-form ultimate':'Second-form ultimate';button.append(small);}
  button.onclick=()=>{$('tour').checked=false;selectSword(i+1);};
  $('abilities').append(button);return button;
});
function selectSword(n) {
  selected=n; elapsed=0; accumulator=0; started=false; paused=false;
  sim=new Sim('custom',3,{visual:true,timeLimit:999,roster:['swordsaint'],atOnce:1});
  // Only this preview instance is scripted: the real attacks, hazards, impacts and rendering run normally.
  sim.updateWaves=()=>{};
  sim.aiIntent=()=>({...NO_INTENT});
  previewBoss=sim.spawnEnemy('swordsaint',n===1?-6:-48,0);
  previewBoss.state='idle';previewBoss.st=0;previewBoss.cds={};previewBoss.fx=1;previewBoss.fy=0;
  previewBoss.intent=$('advanced').checked?100:0;
  if(n>=10){previewBoss.phase=2;previewBoss.unity=true;previewBoss.dmgMul*=previewBoss.def.phase2.dmgMul;}
  sim.p.x=n===1?15:22;sim.p.y=0;sim.p.hp=sim.p.maxHp=10000;sim.p.fx=-1;sim.p.fy=0;
  sim.waveIdx=1;sim.fx.length=0;
  renderer=new Renderer($('view'));
  renderer.draw(sim,0,{});
  buttons.forEach((b,i)=>b.setAttribute('aria-current',String(i+1===n)));
  $('title').textContent=roman[n-1]+' · '+SWORD_NAMES[n-1];
  $('description').textContent=descriptions[n-1];
  const enhanced=!!THIRTEEN[n]?.adv;
  $('advanced').disabled=!enhanced;
  $('variant-note').textContent=enhanced?($('advanced').checked?'Enhanced form · starts with 100 Sword Intent':'Base form · starts with 0 Sword Intent'):'This ultimate has one form.';
  $('pause').textContent='Pause';updateStatus();
}
function updateStatus(){
  $('progress').value=elapsed/durations[selected-1];
  $('status').textContent=(paused?'Paused':'Playing')+' · '+$('speed').value+'× speed · '+elapsed.toFixed(2)+' / '+durations[selected-1].toFixed(1)+' seconds · '+(selected>=10?'Second form':'First form');
}
function tick(){
  if(elapsed>=durations[selected-1]){
    if(paused)return;
    selectSword($('tour').checked?selected%13+1:selected);
  }
  if(!started&&elapsed>=.5){
    started=true;
    if(selected===9||selected===13)sim.startUlt(previewBoss);
    else sim.startAttack(previewBoss,sim.swordCast(previewBoss,swordOf(selected)));
  }
  sim.step(idleAction);
  // A durable practice target survives the complete move without interrupting the cast.
  sim.p.hp=sim.p.maxHp;
  renderer.draw(sim,DT,{sound:$('sound').checked});
  elapsed+=DT;
  updateStatus();
}
function frame(now){
  const dt=last?Math.min(.1,(now-last)/1000):0;last=now;
  if(!paused){
    accumulator+=dt*Number($('speed').value);
    while(accumulator>=DT){accumulator-=DT;tick();}
  }
  requestAnimationFrame(frame);
}
$('replay').onclick=()=>selectSword(selected);
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'Resume':'Pause';updateStatus();};
$('step').onclick=()=>{paused=true;accumulator=0;$('pause').textContent='Resume';tick();updateStatus();};
$('advanced').onchange=()=>selectSword(selected);
$('speed').onchange=()=>{accumulator=0;updateStatus();};
$('sound').onchange=()=>{if($('sound').checked)sfx.unlock();};
selectSword(1);requestAnimationFrame(frame);
</script>
</html>
