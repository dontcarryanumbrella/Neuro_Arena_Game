<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Arena previews</title>
<style>body{margin:0;background:#000;color:#ddd;font:12px monospace}#sheet{width:100vw;image-rendering:pixelated;display:block}p{margin:4px 8px}</style></head>
<body>
<p>Every world's arena, with its ambient life moving. Add ?world=night to see one alone, larger. Open through the local server.</p>
<canvas id="sheet"></canvas>
<script src="../js/sfx.js"></script><script src="../js/agent.js"></script><script src="../js/sim.js"></script><script src="../js/render.js"></script><script src="../js/arenas.js"></script>
<script>
const only = new URLSearchParams(location.search).get('world');
const ids = only ? [only] : Object.keys(WORLD_SCENES), cols = only ? 1 : 3;
const sheet = document.getElementById('sheet'), g = sheet.getContext('2d');
sheet.width = cols * W; sheet.height = Math.ceil(ids.length / cols) * H;
const baked = Object.fromEntries(ids.map(id => [id, bakeWorldArena(id)]));
const tile = document.createElement('canvas'); tile.width = W; tile.height = H;
const tg = tile.getContext('2d');
function frame(now) {
  const t = now / 1000;
  ids.forEach((id, i) => {
    tg.fillStyle = '#000'; tg.fillRect(0, 0, W, H); tg.drawImage(baked[id], 0, 0); drawWorldAmbient(tg, id, t);
    tg.fillStyle = 'rgba(0,0,0,0.6)'; tg.fillRect(0, 0, id.length * 6 + 6, 10); tg.fillStyle = '#fff'; tg.font = '8px monospace'; tg.fillText(id, 3, 8);
    g.drawImage(tile, (i % cols) * W, Math.floor(i / cols) * H);
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
