<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Arena previews</title>
<style>body{margin:0;background:#000;color:#ddd;font:12px monospace}#sheet{width:100vw;display:block;image-rendering:pixelated}p{margin:4px 8px}</style></head>
<body>
<p>Every world's arena, with its ambient life moving. Add ?world=night to see one alone, larger. Open through the local server.</p>
<canvas id="sheet"></canvas>
<script src="../js/sfx.js"></script><script src="../js/agent.js"></script><script src="../js/sim.js"></script><script src="../js/render.js"></script><script src="../js/arenas.js"></script><script src="../js/swordfx.js"></script><script src="../js/finale-arenas.js"></script><script src="../js/celestial.js"></script>
<script>
const only = new URLSearchParams(location.search).get('world');
const ids = only ? [only] : Object.keys(WORLD_SCENES), cols = only ? 1 : 3;
const sheet = document.getElementById('sheet'), g = sheet.getContext('2d');
const S = ARENA_S;
sheet.width = cols * W * S; sheet.height = Math.ceil(ids.length / cols) * H * S;
const t0 = performance.now(), baked = Object.fromEntries(ids.map(id => [id, bakeWorldArena(id)]));
window.bakeMs = (performance.now() - t0) / ids.length;
const tile = document.createElement('canvas'), ambient = document.createElement('canvas');
ambient.width = W * WORLD_BG_PX; ambient.height = H * WORLD_BG_PX;
function frame(now) {
  const t = now / 1000;
  ids.forEach((id, i) => {
    const ox = (i % cols) * W * S, oy = Math.floor(i / cols) * H * S;
    const P = ARENA_PX; tile.width = W * P; tile.height = H * P; const tg = tile.getContext('2d');
    tg.drawImage(baked[id], 0, 0); const ag = ambient.getContext('2d'); ag.setTransform(1, 0, 0, 1, 0, 0); ag.clearRect(0, 0, ambient.width, ambient.height); ag.setTransform(WORLD_BG_PX, 0, 0, WORLD_BG_PX, 0, 0); drawWorldAmbient(ag, id, t); tg.imageSmoothingEnabled = false; tg.drawImage(ambient, 0, 0, tile.width, tile.height);
    g.setTransform(1, 0, 0, 1, 0, 0); g.imageSmoothingEnabled = false; g.drawImage(tile, ox, oy, W * S, H * S);
    g.setTransform(S, 0, 0, S, ox, oy);
    g.fillStyle = 'rgba(0,0,0,0.6)'; g.fillRect(0, 0, id.length * 6 + 6, 10); g.fillStyle = '#fff'; g.font = '8px monospace'; g.fillText(id, 3, 8);
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
